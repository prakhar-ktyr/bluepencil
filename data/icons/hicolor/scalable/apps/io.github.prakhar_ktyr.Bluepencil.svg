<!-- Bluepencil's app icon: a blue pencil over a page. Colours from the GNOME palette. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- the page, with its shadow and folded corner -->
  <path d="M30 16 H78 L100 38 V112 a6 6 0 0 1 -6 6 H30 a6 6 0 0 1 -6 -6 V22 a6 6 0 0 1 6 -6 Z" fill="#000000" fill-opacity="0.18" transform="translate(0 3)"/>
  <path d="M30 14 H78 L100 36 V110 a6 6 0 0 1 -6 6 H30 a6 6 0 0 1 -6 -6 V20 a6 6 0 0 1 6 -6 Z" fill="#ffffff" stroke="#c0bfbc" stroke-width="1"/>
  <path d="M78 14 V30 a6 6 0 0 0 6 6 H100 Z" fill="#deddda"/>
  <!-- lines of text -->
  <g fill="#c0bfbc">
    <rect x="36" y="44" width="52" height="5" rx="2.5"/>
    <rect x="36" y="56" width="44" height="5" rx="2.5"/>
    <rect x="36" y="68" width="48" height="5" rx="2.5"/>
    <rect x="36" y="80" width="26" height="5" rx="2.5"/>
  </g>
  <!-- the pencil, drawn pointing right and then turned to point up and right -->
  <g transform="translate(70 86) rotate(-40)">
    <rect x="-52" y="-9" width="10" height="18" rx="3" fill="#f66151"/>
    <rect x="-44" y="-9" width="8" height="18" fill="#c0bfbc"/>
    <rect x="-44" y="-9" width="8" height="4" fill="#deddda"/>
    <rect x="-36" y="-9" width="58" height="18" fill="#3584e4"/>
    <rect x="-36" y="-9" width="58" height="6" fill="#62a0ea"/>
    <rect x="-36" y="3" width="58" height="6" fill="#1c71d8"/>
    <path d="M22 -9 L44 0 L22 9 Z" fill="#f9dfb6"/>
    <path d="M22 -9 L44 0 L22 -3 Z" fill="#fbeacf"/>
    <path d="M36.5 -3.1 L44 0 L36.5 3.1 Z" fill="#3d3846"/>
  </g>
</svg>
