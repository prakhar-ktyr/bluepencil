<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Bluepencil's app icon: a blue pencil over a page. Colours from the GNOME
       palette. Sized like GNOME's own document icons (Document Viewer, Text
       Editor): about 96 by 112 on the 128 canvas, inside its 8-pixel margin.
       Keep this note here, below the svg tag: icon loaders look for that tag
       near the start of the file. -->
  <!-- the page, with its shadow and folded corner -->
  <path d="M26 11 H86 L110 35 V109 a8 8 0 0 1 -8 8 H26 a8 8 0 0 1 -8 -8 V19 a8 8 0 0 1 8 -8 Z" fill="#000000" fill-opacity="0.18"/>
  <path d="M26 8 H86 L110 32 V106 a8 8 0 0 1 -8 8 H26 a8 8 0 0 1 -8 -8 V16 a8 8 0 0 1 8 -8 Z" fill="#ffffff" stroke="#c0bfbc" stroke-width="1"/>
  <path d="M86 8 V24 a8 8 0 0 0 8 8 H110 Z" fill="#deddda"/>
  <!-- lines of text -->
  <g fill="#c0bfbc">
    <rect x="30" y="42" width="62" height="6" rx="3"/>
    <rect x="30" y="56" width="52" height="6" rx="3"/>
    <rect x="30" y="70" width="58" height="6" rx="3"/>
    <rect x="30" y="84" width="30" height="6" rx="3"/>
  </g>
  <!-- the pencil, drawn pointing right and then turned to point up and right -->
  <g transform="translate(67.8 71.9) rotate(-40) scale(1.2)">
    <rect x="-52" y="-9" width="10" height="18" rx="3" fill="#f66151"/>
    <rect x="-44" y="-9" width="8" height="18" fill="#c0bfbc"/>
    <rect x="-44" y="-9" width="8" height="4" fill="#deddda"/>
    <rect x="-36" y="-9" width="58" height="18" fill="#3584e4"/>
    <rect x="-36" y="-9" width="58" height="6" fill="#62a0ea"/>
    <rect x="-36" y="3" width="58" height="6" fill="#1c71d8"/>
    <path d="M22 -9 L44 0 L22 9 Z" fill="#f9dfb6"/>
    <path d="M22 -9 L44 0 L22 -3 Z" fill="#fbeacf"/>
    <path d="M36.5 -3.1 L44 0 L36.5 3.1 Z" fill="#3d3846"/>
  </g>
</svg>
