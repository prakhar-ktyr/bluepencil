<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Bluepencil's app icon: a chunky blue pencil writing a blue line, the
       name as the picture. Most document apps are a white page with
       something on it; this one is not. Colours from the GNOME palette.
       Keep this note below the svg tag: icon loaders look for that tag near
       the start of the file. -->

  <!-- the line it writes -->
  <path d="M22 104 C 40 92, 66 120, 108 100" fill="none" stroke="#1c71d8" stroke-width="12" stroke-linecap="round"/>

  <!-- the pencil, drawn pointing right from its middle, then turned so that
       its tip rests on the start of the line -->
  <g transform="translate(63 63) rotate(135)">
    <!-- After the turn, the drawing's lower side (positive y) faces the top
         left, where the light comes from: that side is the light one. -->
    <!-- eraser -->
    <rect x="-58" y="-17" width="18" height="34" rx="6" fill="#f66151"/>
    <rect x="-58" y="-17" width="18" height="11" rx="5" fill="#ed333b"/>
    <rect x="-49" y="-17" width="9" height="11" fill="#ed333b"/>
    <!-- metal band -->
    <rect x="-45" y="-17" width="12" height="34" fill="#deddda"/>
    <rect x="-45" y="11" width="12" height="6" fill="#f6f5f4"/>
    <rect x="-45" y="-17" width="12" height="11" fill="#c0bfbc"/>
    <rect x="-42" y="-17" width="1.5" height="34" fill="#9a9996"/>
    <rect x="-37.5" y="-17" width="1.5" height="34" fill="#9a9996"/>
    <!-- sharpened wood -->
    <path d="M20 -17 L58 0 L20 0 Z" fill="#f0cf9d"/>
    <path d="M20 0 L58 0 L20 17 Z" fill="#fbeacf"/>
    <!-- blue lead -->
    <path d="M46 -5.3 L58 0 L46 0 Z" fill="#1a5fb4"/>
    <path d="M46 0 L58 0 L46 5.3 Z" fill="#3584e4"/>
    <!-- painted body: three facets, each ending in the curve the sharpener leaves -->
    <path d="M-33 -17 H23 Q29 -11.5 23 -6 H-33 Z" fill="#1c71d8"/>
    <path d="M-33 -6 H23 Q29 0 23 6 H-33 Z" fill="#3584e4"/>
    <path d="M-33 6 H23 Q29 11.5 23 17 H-33 Z" fill="#62a0ea"/>
    <rect x="-31" y="13" width="50" height="2" rx="1" fill="#99c1f1"/>
  </g>
</svg>
