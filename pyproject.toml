[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bluepencil"
description = "Edit, sign, organize and convert PDFs, fully offline"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dynamic = ["version"]
# GTK 4, libadwaita and PyGObject come from the system, or from the GNOME
# runtime inside the snap, so they are deliberately not listed here.
# The PDF engine is pinned to an exact version: upgrades are deliberate.
dependencies = ["pymupdf==1.28.2"]

[project.optional-dependencies]
test = ["pytest"]
# Exact versions, so that a new release of a checker cannot fail
# `./dev check` on unchanged code.
check = ["ruff==0.17.5", "mypy==2.4.1"]

[project.gui-scripts]
bluepencil = "bluepencil.__main__:main"

[tool.setuptools.packages.find]
include = ["bluepencil*"]

[tool.setuptools.dynamic]
version = { attr = "bluepencil.VERSION" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "C4", "PIE", "PERF", "PTH", "PL", "RUF"]
ignore = [
    "PLR2004", # numbers in comparisons: tests compare with expected sizes all the time
    "PLR0913", # many arguments
    "RUF012",  # class-level dictionaries such as __gsignals__ are how PyGObject works
]
# Typographic quotes, apostrophes and dashes are wanted in interface text.
allowed-confusables = ["’", "‘", "“", "”", "–", "×"]

[tool.mypy]
python_version = "3.12"
files = ["bluepencil", "tests", "bench"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# PyGObject has no type information, so calls into GTK are not checked.
module = ["gi", "gi.*"]
ignore_missing_imports = true
